<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join a Quiz — QuizCode</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235B4FE8'/%3E%3Cpath d='M9 21l4-4-4-4M15 21h8' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#4F46E5; color:#fff; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
  .card { background:#fff; color:#111; border-radius:20px; padding:32px 28px; max-width:360px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:#555; font-size:14px; margin:0 0 20px; line-height:1.5; }
  .code { font-size:32px; font-weight:800; letter-spacing:4px; color:#4F46E5; background:#EEF2FF; border-radius:12px; padding:16px; margin-bottom:20px; }
  .cta { display:block; background:#4F46E5; color:#fff; text-decoration:none; font-weight:700; font-size:15px; border-radius:12px; padding:14px; margin-bottom:12px; }
  .cta:active { opacity:0.85; }
  .cta.secondary { background:#EEF0FE; color:#4F46E5; }
  .divider { display:flex; align-items:center; gap:10px; margin:4px 0 16px; color:#bbb; font-size:12px; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:#eee; }
  .hint { font-size:12px; color:#999; margin-bottom:0; }
</style>
</head>
<body>
  <!-- Reached only when the app ISN'T installed — a verified Android App Link intercepts
       this URL before the browser ever loads it when the app IS installed (see
       AndroidManifest.xml's autoVerify intent-filter), so this page's job is purely
       "get the app, here's your code for after." -->
  <div class="card">
    <h1>You're invited to a quiz! 🎉</h1>
    <p>Get the QuizCode app to join — then enter this code:</p>
    <div class="code" id="code">------</div>
    <a class="cta" id="playStoreLink" href="https://play.google.com/store/apps/details?id=com.craftbytestudio.quizcode.learning">📲 Get QuizCode on Google Play</a>
    <div class="divider">or</div>
    <a class="cta secondary" id="takeInBrowserLink" href="/take/">🌐 Take it in your browser</a>
    <p class="hint" style="margin-top:12px">Not showing up yet? The app is still in testing — ask the quiz creator directly.</p>
  </div>
  <script>
    // Two ways in:
    //   ?code=XXXXXX — the plain code, used by the text share message.
    //   ?t=<token>   — the encrypted token a QR carries (see QrCodePayloadCodec.kt).
    // Same AES-GCM key and "1" + base64url(iv(12) ‖ ciphertext+tag) format as the app.
    // NOTE: this key is obfuscation, not security — it ships in the APK and, right here,
    // in public JavaScript. A share code was never a secret; this only keeps the QR/link
    // from being casually readable. Keep in sync with QrCodePayloadCodec.kt.
    var QR_KEY_HEX = '61c72cd0756eb7e72fdef2e9cbe597167a9fba6c6666436efcc9f4f745ddd44a';

    function hexToBytes(hex) {
      var out = new Uint8Array(hex.length / 2);
      for (var i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
      return out;
    }

    function base64UrlToBytes(s) {
      var b64 = s.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bin = atob(b64);
      var out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    // Resolves to the 6-char code, or null for anything malformed/tampered/foreign.
    function decryptToken(token) {
      if (!token || token.charAt(0) !== '1' || !window.crypto || !crypto.subtle) {
        return Promise.resolve(null);
      }
      var raw;
      try { raw = base64UrlToBytes(token.substring(1)); } catch (e) { return Promise.resolve(null); }
      if (raw.length <= 12) return Promise.resolve(null);
      var iv = raw.slice(0, 12);
      var body = raw.slice(12);
      return crypto.subtle.importKey('raw', hexToBytes(QR_KEY_HEX), 'AES-GCM', false, ['decrypt'])
        .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, body); })
        .then(function (plain) {
          var payload = JSON.parse(new TextDecoder().decode(plain));
          return /^[A-Z0-9]{6}$/.test(payload.c) ? payload.c : null;
        })
        .catch(function () { return null; });
    }

    function showCode(code) {
      if (!code) return;
      code = code.toUpperCase();
      document.getElementById('code').textContent = code;
      // Carries the code through to Play Store as a referrer, so once the app IS
      // installed from here it can pick this same code back up automatically
      // (Play Install Referrer API) instead of the user having to retype it.
      var link = document.getElementById('playStoreLink');
      link.href = link.href + '&referrer=' + encodeURIComponent('code=' + code);
      document.getElementById('takeInBrowserLink').href = '/take/?code=' + encodeURIComponent(code);
    }

    var params = new URLSearchParams(window.location.search);
    var plainCode = params.get('code');
    if (plainCode) {
      showCode(plainCode);
    } else {
      // Leaves the "------" placeholder up if the token can't be read — the Play Store
      // and browser links still work, the visitor just doesn't get a prefilled code.
      decryptToken(params.get('t')).then(showCode);
    }
  </script>
</body>
</html>
