<!DOCTYPE html>

<!-- Cookie consent gate — must load before the inline analytics script below
     holds off PostHog until the visitor accepts. Shared across home/take/join. -->
<script src="/cookie-consent.js" defer></script>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#4F46E5; color:#fff; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
  .card { background:#fff; color:#111; border-radius:20px; padding:32px 28px; max-width:360px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:#555; font-size:14px; margin:0 0 20px; line-height:1.5; }
  .code { font-size:32px; font-weight:800; letter-spacing:4px; color:#4F46E5; background:#EEF2FF; border-radius:12px; padding:16px; margin-bottom:20px; }
  .cta { display:block; background:#4F46E5; color:#fff; text-decoration:none; font-weight:700; font-size:15px; border-radius:12px; padding:14px; margin-bottom:12px; }
  .cta:active { opacity:0.85; }
  .cta.secondary { background:#EEF0FE; color:#4F46E5; }
  /* Pre-launch Play state (PLAY-CTA): a <span>, so it must not look tappable. */
  .cta.is-soon { background:#EEF0FE; color:#4F46E5; opacity:0.8; cursor:default; border:1.5px dashed #C7CCF5; }
  .divider { display:flex; align-items:center; gap:10px; margin:4px 0 16px; color:#bbb; font-size:12px; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:#eee; }
  .hint { font-size:12px; color:#999; margin-bottom:0; }
</style>
</head>
<body>
  <!-- Reached only when the app ISN'T installed — a verified Android App Link intercepts
       this URL before the browser ever loads it when the app IS installed (see
       AndroidManifest.xml's autoVerify intent-filter), so this page's job is purely
       "get the app, here's your code for after." -->
  <div class="card">
    <h1>You're invited to a quiz! 🎉</h1>
    <p>Quizoma is coming to Google Play in October 2026. Until then, take the quiz right in your browser with this code:</p>
    <div class="code" id="code">------</div>
    <!-- PLAY-CTA (join fallback). At launch, restore the <a> so the install
         referrer below is applied again:
    <a class="cta" id="playStoreLink" href="https://play.google.com/store/apps/details?id=com.craftbytestudio.quizoma">📲 Get Quizoma on Google Play</a> -->
    <span class="cta is-soon" id="playStoreLink">📲 Coming soon on Google Play</span>
    <div class="divider">or</div>
    <a class="cta" id="takeInBrowserLink" href="/take/" target="_blank" rel="noopener">🌐 Take it in your browser</a>
    <p class="hint" style="margin-top:12px">No app needed — the browser works on any phone or laptop.</p>
  </div>
  <script>
    // PostHog analytics — same window.Analytics.{track,screen} contract as
    // take/analytics.js (kept inline here rather than a separate file, since this page's
    // deploy step only ever copies this one index.html — see deploy/DEPLOY.md/deploy.sh).
    // Gated on cookie-consent.js (loaded above): the snippet never loads, let alone
    // captures anything, until the visitor has explicitly accepted the cookie banner.
    (function () {
      var POSTHOG_API_KEY = "phc_uT6HjPYV4TLQ452NHGEuABxHuC6KUDfBQtHXHebhj2wm";
      var POSTHOG_HOST = "https://us.i.posthog.com";
      function noop() {}
      window.Analytics = { track: noop, screen: noop };
      if (!POSTHOG_API_KEY) return;

      function loadPostHog() {
        !function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.crossOrigin="anonymous",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],Object.defineProperty(u,"toString",{configurable:!0,enumerable:!0,writable:!0,value:function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e}}),Object.defineProperty(u.people,"toString",{configurable:!0,enumerable:!0,writable:!0,value:function(){return u.toString(1)+".people (stub)"}}),o="init capture register register_once register_for_session unregister unregister_for_session getFeatureFlag getFeatureFlagResult isFeatureEnabled reloadFeatureFlags updateEarlyAccessFeatureEnrollment getEarlyAccessFeatures on onFeatureFlags onSessionId getSurveys getActiveMatchingSurveys renderSurvey canRenderSurvey getNextSurveyStep identify setPersonProperties group resetGroups setPersonPropertiesForFlags resetPersonPropertiesForFlags setGroupPropertiesForFlags resetGroupPropertiesForFlags reset get_distinct_id getGroups get_session_id get_session_replay_url alias set_config startSessionRecording stopSessionRecording sessionRecordingStarted captureException loadToolbar get_property getSessionProperty createPersonProfile opt_in_capturing opt_out_capturing has_opted_in_capturing has_opted_out_capturing clear_opt_in_out_capturing debug".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);
        posthog.init(POSTHOG_API_KEY, { api_host: POSTHOG_HOST, defaults: "2026-05-30", capture_pageview: false, autocapture: false, disable_session_recording: true, capture_pageleave: false });
        // Super property — see take/analytics.js's registerPlatform() for why every
        // page/platform registers its own, so events are never confused across them.
        try { posthog.register({ platform: "web" }); } catch (e) {}
        window.Analytics = {
          track: function (event, props) { try { posthog.capture(event, props || {}); } catch (e) {} },
          screen: function (name, props) {
            try { posthog.capture("$pageview", Object.assign({ screen_name: name }, props || {})); } catch (e) {}
          }
        };
        window.Analytics.screen("JoinLanding");
      }

      if (window.QuizomaConsent) {
        window.QuizomaConsent.onGrant(loadPostHog);
        window.QuizomaConsent.onRevoke(function () {
          try { if (window.posthog) posthog.opt_out_capturing(); } catch (e) {}
          window.Analytics = { track: noop, screen: noop };
        });
      }
    })();

    // Both CTAs report through window.Analytics, which stays a no-op stub until the
    // visitor accepts the cookie banner (see the consent gate above).
    var ctaEvents = {
      playStoreLink: 'join_play_store_clicked',
      takeInBrowserLink: 'join_take_in_browser_clicked'
    };
    Object.keys(ctaEvents).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('click', function () { window.Analytics.track(ctaEvents[id]); });
    });

    // Desktop has no Play Store to send anyone to, so there's nothing to choose between —
    // skip this card entirely and go straight to the browser flow. Only Android/iOS (where
    // the app is actually installable) get asked.
    var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (!isMobile) document.querySelector('.card').style.visibility = 'hidden';

    // Two ways in:
    //   ?code=XXXXXX — the plain code, used by the text share message.
    //   ?t=<token>   — the encrypted token a QR carries (see QrCodePayloadCodec.kt).
    // Same AES-GCM key and "1" + base64url(iv(12) ‖ ciphertext+tag) format as the app.
    // NOTE: this key is obfuscation, not security — it ships in the APK and, right here,
    // in public JavaScript. A share code was never a secret; this only keeps the QR/link
    // from being casually readable. Keep in sync with QrCodePayloadCodec.kt.
    var QR_KEY_HEX = '61c72cd0756eb7e72fdef2e9cbe597167a9fba6c6666436efcc9f4f745ddd44a';

    function hexToBytes(hex) {
      var out = new Uint8Array(hex.length / 2);
      for (var i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
      return out;
    }

    function base64UrlToBytes(s) {
      var b64 = s.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bin = atob(b64);
      var out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    // Resolves to the 6-char code, or null for anything malformed/tampered/foreign.
    function decryptToken(token) {
      if (!token || token.charAt(0) !== '1' || !window.crypto || !crypto.subtle) {
        return Promise.resolve(null);
      }
      var raw;
      try { raw = base64UrlToBytes(token.substring(1)); } catch (e) { return Promise.resolve(null); }
      if (raw.length <= 12) return Promise.resolve(null);
      var iv = raw.slice(0, 12);
      var body = raw.slice(12);
      return crypto.subtle.importKey('raw', hexToBytes(QR_KEY_HEX), 'AES-GCM', false, ['decrypt'])
        .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, body); })
        .then(function (plain) {
          var payload = JSON.parse(new TextDecoder().decode(plain));
          return /^[A-Z0-9]{6}$/.test(payload.c) ? payload.c : null;
        })
        .catch(function () { return null; });
    }

    // The ?t= path already charset-checks inside decryptToken; the plain ?code= path
    // did not. Reject anything that isn't a share code so a long/odd string can't be
    // reflected into the page or the Play/browser/redirect links.
    function validCode(rawCode) {
      if (!rawCode) return null;
      var code = String(rawCode).toUpperCase();
      return /^[A-Z0-9]{4,8}$/.test(code) ? code : null;
    }

    function showCode(code) {
      document.getElementById('code').textContent = code;
      // Carries the code through to Play Store as a referrer, so once the app IS
      // installed from here it can pick this same code back up automatically
      // (Play Install Referrer API) instead of the user having to retype it.
      var link = document.getElementById('playStoreLink');
      // Before the Play listing is live this is a <span> (see PLAY-CTA above),
      // so there is no href to carry the referrer on. Restored automatically
      // once the <a> comes back.
      if (link && link.tagName === 'A') {
        link.href = link.href + '&referrer=' + encodeURIComponent('code=' + code);
      }
      document.getElementById('takeInBrowserLink').href = '/take/?code=' + encodeURIComponent(code);
    }

    function handleCode(rawCode) {
      var code = validCode(rawCode);
      if (isMobile) {
        // Leaves the "------" placeholder up if the code can't be read — the Play Store
        // and browser links still work, the visitor just doesn't get a prefilled code.
        if (code) showCode(code);
      } else {
        window.location.replace(code ? '/take/?code=' + encodeURIComponent(code) : '/take/');
      }
    }

    var params = new URLSearchParams(window.location.search);
    var plainCode = params.get('code');
    if (plainCode) {
      handleCode(plainCode);
    } else {
      decryptToken(params.get('t')).then(handleCode);
    }
  </script>
</body>
</html>
